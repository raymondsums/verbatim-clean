<!doctype html><html><head><meta charset="utf-8"><title>Job Application for Product Designer at Replica</title>
<style>
  body { font: 14px/1.5 -apple-system, sans-serif; margin: 40px auto; max-width: 620px; padding: 0 16px; }
  .field { margin-bottom: 22px; } label { display: block; font-weight: 600; margin-bottom: 4px; }
  textarea, select { width: 100%; box-sizing: border-box; font: inherit; padding: 6px 8px; border: 1px solid #ccc; border-radius: 4px; }
  textarea { height: 110px; }
  .select__control { display: flex; border: 1px solid #ccc; border-radius: 4px; padding: 6px 8px; min-height: 20px; cursor: pointer; }
  .select__value-container { flex: 1; display: grid; } .select__value-container > * { grid-area: 1 / 1; }
  .select__placeholder { color: #888; } .select__input { border: 0; outline: 0; font: inherit; background: transparent; }
  .select__menu { border: 1px solid #ccc; border-top: 0; background: #fff; } .select__option { padding: 6px 8px; }
  .select__option:hover { background: #eef; }
</style></head><body>
<!-- The suggestion pill and card placement, shot in four states:
     ?state=pill    a written question in focus, a draft ready: pill only
     ?state=card    the pill clicked: the card opens beside the field
     ?state=choice  a dropdown open: a "Suggest" pill beside it, clear of the list
     ?state=select  a native select in focus with a suggestion
     The extension's messages are stubbed here, so no model is called. -->
<form id="application_form">
  <div class="field"><label for="why">Why are you interested in this role?*</label><textarea id="why"></textarea></div>
  <div class="field"><label id="loc-label">While this role is open to remote candidates across the United States, team members located within 40 miles of our Scottsdale, AZ headquarters are expected to work onsite. How does this align with your location and ability to work?*</label>
    <div class="rs" data-id="loc" data-opts="I live within 40 miles and am interested in working onsite|I live within 40 miles and would prefer to work remotely|I'm open to relocating and working onsite|I live outside 40 miles and am interested in hybrid opportunities|I live outside 40 miles and am interested in fully remote opportunities"></div></div>
  <div class="field"><label for="heard">How did you hear about this job?*</label>
    <select id="heard"><option value="">Select...</option><option>LinkedIn</option><option>Company website</option><option>Referral</option><option>Other</option></select></div>
</form>
<script>
for (const host of document.querySelectorAll(".rs")) {
  const opts = host.dataset.opts.split("|"), id = host.dataset.id;
  host.innerHTML = `<div class="select__control"><div class="select__value-container">
    <div class="select__placeholder">Select...</div>
    <input class="select__input" id="${id}" role="combobox" aria-expanded="false" aria-haspopup="true" aria-autocomplete="list" autocomplete="off" aria-labelledby="${id}-label">
  </div></div>`;
  const ctl = host.querySelector(".select__control"), input = host.querySelector("input");
  let menu = null;
  const close = () => { if (menu) menu.remove(); menu = null; input.setAttribute("aria-expanded", "false"); input.removeAttribute("aria-controls"); };
  const pick = o => {
    host.querySelector(".select__placeholder, .select__single-value")?.remove();
    const sv = document.createElement("div"); sv.className = "select__single-value"; sv.textContent = o;
    host.querySelector(".select__value-container").prepend(sv);
    input.value = ""; close();
  };
  ctl.addEventListener("click", () => {
    if (menu) return;
    menu = document.createElement("div"); menu.className = "select__menu"; host.append(menu);
    const list = document.createElement("div"); list.setAttribute("role", "listbox"); list.id = `react-select-${id}-listbox`;
    for (const o of opts) {
      const d = document.createElement("div"); d.className = "select__option"; d.setAttribute("role", "option"); d.textContent = o;
      d.addEventListener("mousedown", e => { e.preventDefault(); pick(o); });
      list.append(d);
    }
    menu.append(list);
    input.setAttribute("aria-expanded", "true"); input.setAttribute("aria-controls", list.id); input.focus();
  });
  input.addEventListener("blur", () => setTimeout(() => { if (document.activeElement !== input) close(); }, 50));
}
document.addEventListener("DOMContentLoaded", () => {
  const real = window.chrome.runtime.sendMessage;
  const canned = {
    "answers-field": { group: null, category: "normal",
      ready: { sentences: [{ text: "I've spent five years designing consumer apps where small details decide whether people come back." },
                           { text: "This role is that work at a bigger scale." }], sources: [] } },
    "plan": p => ({ plan: [/Scottsdale|location/i.test(p.fields[0].label)
        ? { index: 0, key: "location_fit", action: "fill", value: "I live outside 40 miles and am interested in fully remote opportunities" }
        : /hear about/i.test(p.fields[0].label)
          ? { index: 0, key: "source", action: "fill", value: "LinkedIn" } : null].filter(Boolean),
      unidentified: 0 }),
    "answers-predraft": { ok: true }, "answers-predraft-status": { drafts: {} },
    "posting-check": { checks: [] }, "answers-check": {}, "answers-stories": { stories: [] },
    "latest-docs": {}, "watch-jobs": { jobs: [] }, "jobs-check": {}, "tailor-status": {},
  };
  window.chrome.runtime.sendMessage = async msg => {
    const c = canned[msg.type];
    if (c === undefined) return real(msg);
    return { ok: true, data: typeof c === "function" ? c(msg.payload) : c };
  };
});
window.addEventListener("load", () => setTimeout(async () => {
  const state = new URLSearchParams(location.search).get("state") || "pill";
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const pill = () => document.querySelector("#verbatim-root, [id^='verbatim']")?.shadowRoot?.getElementById("pill")
    || [...document.querySelectorAll("*")].map(e => e.shadowRoot).filter(Boolean).map(s => s.getElementById("pill")).find(Boolean);
  if (state === "pill" || state === "card") {
    document.getElementById("why").focus();
    await wait(400);
    if (state === "card") pill()?.click();
  } else if (state === "choice") {
    document.querySelector(".rs .select__control").click();
  } else if (state === "pick") {
    // The pill clicked: the option must end up picked.
    document.querySelector(".rs .select__control").click();
    await wait(1200);
    pill()?.click();
    await wait(2500);
    document.body.dataset.picked = document.querySelector(".select__single-value")?.textContent || "none";
  } else if (state === "select") {
    document.getElementById("heard").focus();
  }
  if (new URLSearchParams(location.search).has("debug")) {
    await wait(2500);
    document.body.dataset.pill = (pill() && pill().textContent) || "none";
  }
}, 600));
window.addEventListener("error", e => { document.body.dataset.err = (document.body.dataset.err || "") + e.message + "|"; });
window.addEventListener("unhandledrejection", e => { document.body.dataset.err = (document.body.dataset.err || "") + String(e.reason) + "|"; });
</script>
</body></html>
