<!doctype html><html><head><meta charset="utf-8"><meta name="job-toolkit-autotest" content="1"><title>Apply - Lever</title></head><body>

<form>
  <div class="application-field"><label>Full name<span class="required">*</span></label><input type="text" name="name" placeholder="Your full name"></div>
  <div class="application-field"><label>Email<span class="required">*</span></label><input type="email" name="email" placeholder="you@example.com"></div>
  <div class="application-field"><label>Phone</label><input type="text" name="phone" placeholder="Your phone number"></div>
  <div class="application-field"><label>Current location</label><input type="text" name="location" placeholder="City, State"></div>
  <div class="application-field"><label>LinkedIn URL</label><input type="text" name="urls[LinkedIn]" placeholder="https://linkedin.com/in/"></div>
  <div class="application-field"><label>Portfolio URL</label><input type="text" name="urls[Portfolio]" placeholder="https://"></div>
  <div class="application-field"><label>Are you legally authorized to work in the United States?</label>
    <select name="cards[abc123][field0]"><option value="">Select ...</option><option>Yes</option><option>No</option></select></div>
  <div class="application-field"><label>Desired compensation</label><input type="text" name="cards[abc123][field1]"></div>
  <div class="application-field"><label>Additional information</label><textarea name="comments" placeholder="Add a cover letter or anything else"></textarea></div>
</form>
</body></html>
