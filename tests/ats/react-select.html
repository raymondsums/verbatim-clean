<!doctype html><html><head><meta charset="utf-8"><meta name="job-toolkit-autotest" content="1"><title>Job Application for Product Designer at Replica</title>
<style>
  body { font: 14px/1.5 -apple-system, sans-serif; margin: 40px auto; max-width: 620px; }
  .field { margin-bottom: 20px; } label { display: block; font-weight: 600; }
  .select__control { display: flex; border: 1px solid #ccc; border-radius: 4px; padding: 6px 8px; min-height: 20px; }
  .select__value-container { flex: 1; display: grid; } .select__value-container > * { grid-area: 1 / 1; }
  .select__placeholder { color: #888; } .select__input { border: 0; outline: 0; font: inherit; background: transparent; }
  .select__menu { border: 1px solid #ccc; } .select__option { padding: 6px 8px; }
  #phone-countries { display: none; }
</style></head><body>
<!-- Greenhouse's react-select, as it behaves on job-boards.greenhouse.io:
     the menu opens on a click on the control and only while the input does
     not have focus; typing into a closed menu does nothing; a pick shows in
     a single-value element and clears the input. The hidden phone-country
     list mimics the page's always-present but invisible options. -->
<div id="phone-countries" role="listbox"><div role="option">Afghanistan +93</div><div role="option">Yemen +967</div></div>
<form id="application_form">
  <div class="field"><label for="first_name">First Name*</label><input type="text" id="first_name"></div>
  <div class="field"><label for="q_auth" id="q_auth-label">Are you legally authorized to work in the United States?*</label><div class="rs" data-opts="Yes|No" data-id="q_auth"></div></div>
  <div class="field"><label for="q_spons" id="q_spons-label">Will you now or in the future require immigration sponsorship?*</label><div class="rs" data-opts="Yes|No" data-id="q_spons"></div></div>
  <div class="field"><label for="gender" id="gender-label">Gender</label><div class="rs" data-opts="Male|Female|Decline To Self Identify" data-id="gender"></div></div>
  <div class="field"><label for="disability" id="disability-label">Disability Status</label><div class="rs" data-opts="Yes, I have a disability (or previously had a disability)|No, I don't have a disability|I don't wish to answer" data-id="disability"></div></div>
  <div class="field"><label for="loc" id="loc-label">Location (City)*</label><div class="rs" data-opts="South San Francisco, California, United States|San Francisco, California, United States|Aguacaliente o San Francisco, Cartago, Costa Rica" data-id="loc"></div></div>
  <div class="field"><label for="gid" id="gid-label">I identify my gender as:*</label><div class="rs" data-opts="Man|Woman|Non-binary|I prefer not to answer" data-id="gid"></div></div>
  <div class="field"><label for="q_office" id="q_office-label">Which office would you work from?</label><div class="rs" data-opts="New York|Austin" data-id="q_office"></div></div>
</form>
<script type="application/json" id="expect">
{"Are you legally authorized": "Yes", "require immigration sponsorship": "No", "Gender": "Male",
 "Disability Status": "No, I don't have a disability", "First Name": "Jordan",
 "Location (City)": "San Francisco, California, United States", "identify my gender": "Man",
 "Which office": ""}
</script>
<script>
for (const host of document.querySelectorAll(".rs")) {
  const opts = host.dataset.opts.split("|"), id = host.dataset.id;
  host.innerHTML = `<div class="select__control"><div class="select__value-container">
    <div class="select__placeholder">Select...</div>
    <input class="select__input" id="${id}" role="combobox" aria-expanded="false" aria-haspopup="true" autocomplete="off" aria-labelledby="${id}-label">
  </div></div>`;
  const ctl = host.querySelector(".select__control"), input = host.querySelector("input");
  let menu = null, focusedBefore = false;
  const close = () => { if (menu) menu.remove(); menu = null; input.setAttribute("aria-expanded", "false"); input.removeAttribute("aria-controls"); };
  const render = () => {
    if (!menu) return;
    const q = input.value.trim().toLowerCase();
    menu.innerHTML = "";
    const list = document.createElement("div"); list.setAttribute("role", "listbox"); list.id = `react-select-${id}-listbox`;
    for (const o of opts.filter(o => o.toLowerCase().includes(q))) {
      const d = document.createElement("div"); d.className = "select__option"; d.setAttribute("role", "option"); d.textContent = o;
      d.addEventListener("mousedown", e => { e.preventDefault(); pick(o); });
      list.append(d);
    }
    menu.append(list);
    input.setAttribute("aria-controls", list.id);
  };
  const pick = o => {
    host.querySelector(".select__placeholder, .select__single-value")?.remove();
    const sv = document.createElement("div"); sv.className = "select__single-value"; sv.textContent = o;
    host.querySelector(".select__value-container").prepend(sv);
    input.value = ""; close();
  };
  ctl.addEventListener("mousedown", () => { focusedBefore = document.activeElement === input; });
  ctl.addEventListener("click", () => {
    if (focusedBefore || menu) return;
    menu = document.createElement("div"); menu.className = "select__menu"; host.append(menu);
    input.setAttribute("aria-expanded", "true"); input.focus(); render();
  });
  input.addEventListener("input", render);
  input.addEventListener("blur", () => setTimeout(() => { if (document.activeElement !== input) { input.value = ""; close(); } }, 50));
}
</script>
</body></html>
