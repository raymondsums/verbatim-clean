<!doctype html><html><head><meta charset="utf-8"><meta name="job-toolkit-autotest" content="1"><title>Apply - SmartRecruiters</title></head><body>

<form>
  <div><label for="first-name">First name</label><input id="first-name" name="firstName" aria-required="true"></div>
  <div><label for="last-name">Last name</label><input id="last-name" name="lastName" aria-required="true"></div>
  <div><label for="email">Email</label><input id="email" name="email" type="email"></div>
  <div><label for="phone-number">Phone number</label><input id="phone-number" name="phoneNumber"></div>
  <div><label for="location-input">Location</label><input id="location-input" name="location"></div>
  <div><label for="web-url">LinkedIn, personal website or portfolio</label><input id="web-url" name="website"></div>
  <div><label for="sq-1">Do you require sponsorship to work in this country?</label>
    <select id="sq-1"><option value="">Choose an option</option><option>Yes</option><option>No</option></select></div>
  <div><label for="sq-2">What is your expected annual salary?</label><input id="sq-2"></div>
</form>
</body></html>
