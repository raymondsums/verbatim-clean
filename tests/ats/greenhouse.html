<!doctype html><html><head><meta charset="utf-8"><meta name="job-toolkit-autotest" content="1"><title>Job Application for Product Designer</title></head><body>

<form id="application_form">
  <div class="field"><label for="first_name">First Name *</label><input type="text" id="first_name" name="job_application[first_name]"></div>
  <div class="field"><label for="last_name">Last Name *</label><input type="text" id="last_name" name="job_application[last_name]"></div>
  <div class="field"><label for="email">Email *</label><input type="email" id="email" name="job_application[email]"></div>
  <div class="field"><label for="phone">Phone</label><input type="tel" id="phone" name="job_application[phone]"></div>
  <div class="field"><label for="question_1">LinkedIn Profile</label><input type="text" id="question_1" name="job_application[answers_attributes][0][text_value]"></div>
  <div class="field"><label for="question_2">Website / Portfolio</label><input type="text" id="question_2" name="job_application[answers_attributes][1][text_value]"></div>
  <div class="field"><label for="question_3">Will you now or in the future require sponsorship for employment visa status?</label>
    <select id="question_3" name="job_application[answers_attributes][2][boolean_value]"><option>Please select</option><option>Yes</option><option>No</option></select></div>
  <div class="field"><label for="question_4">What are your salary expectations?</label><input type="text" id="question_4" name="job_application[answers_attributes][3][text_value]"></div>
  <div class="field"><label for="cover_letter_text">Cover Letter</label><textarea id="cover_letter_text" name="job_application[cover_letter_text]"></textarea></div>
  <div class="field"><label for="gender">Gender</label>
    <select id="gender" name="job_application[gender]"><option>Please select</option><option>Male</option><option>Female</option><option>Decline To Self Identify</option></select></div>
  <div class="field"><label for="hispanic_ethnicity">Are you Hispanic/Latino?</label>
    <select id="hispanic_ethnicity"><option>Please select</option><option>Yes</option><option>No</option><option>Decline To Self Identify</option></select></div>
  <div class="field"><label for="veteran_status">Veteran Status</label>
    <select id="veteran_status"><option>Please select</option><option>I am not a protected veteran</option><option>I identify as one or more of the classifications of a protected veteran</option><option>I don't wish to answer</option></select></div>
  <div class="field"><label for="question_5">How did you hear about this job?</label><input type="text" id="question_5"></div>
</form>
</body></html>
